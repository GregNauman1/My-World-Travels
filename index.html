<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danube River Cruise 2024</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}.title{position:fixed;z-index:1000;top:12px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 18px;border-radius:8px;color:#d62828;font-size:22px;font-weight:700;box-shadow:0 1px 6px #888}.leaflet-popup-content{margin:12px;min-width:300px;max-width:410px}.place{font-size:18px;font-weight:700;margin-bottom:8px}.gallery{display:flex;flex-wrap:nowrap;gap:8px;width:100%;overflow-x:scroll;overflow-y:hidden;box-sizing:border-box;padding:4px 4px 12px;scroll-behavior:smooth;touch-action:pan-x;cursor:grab}.gallery:active{cursor:grabbing}.gallery::-webkit-scrollbar{height:12px}.gallery img{display:block;width:105px;height:78px;flex:0 0 105px;object-fit:cover;border-radius:5px;border:1px solid #ccc;cursor:pointer}.hint{font-size:12px;color:#666}#viewer{display:none;overscroll-behavior:contain;touch-action:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;align-items:center;justify-content:center}#viewer.show{display:flex}#big{max-width:86vw;max-height:84vh;object-fit:contain}.vbtn{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:72px;border:0;border-radius:8px;background:rgba(255,255,255,.2);color:white;font-size:48px;line-height:1;cursor:pointer}#prev{left:18px}#next{right:18px}#close{position:absolute;right:18px;top:8px;background:none;border:0;color:#fff;font-size:42px;cursor:pointer}#counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:5px}</style></head><body><div class="title">Danube River Cruise 2024</div><div id="map"></div><div id="viewer"><button id="close">×</button><button id="prev" class="vbtn">‹</button><img id="big">< leClickZoom.disable();map.boxZoom.disable();map.keyboard.disable();map.getContainer().style.pointerEvents='none'}function closeViewer(){viewer.classList.remove('show');big.removeAttribute('src');map.scrollWheelZoom.enable();map.dragging.enable();map.touchZoom.enable();map.doubleClickZoom.enable();map.boxZoom.enable();map.keyboard.enable();map.getContainer().style.pointerEvents='auto'}function nextPhoto(){showPhoto(currentIndex+1)}function prevPhoto(){showPhoto(currentIndex-1)}viewer.addEventListener('wheel',e=>{e.preventDefault();e.stopPropagation()}, {capture:true,passive:false});viewer.addEventListener('touchmove',e=>e.stopPropagation(), {capture:true,passive:false});document.getElementById('close').onclick=closeViewer;document.getElementById('next').onclick=nextPhoto;document.getElementById('prev').onclick=prevPhoto;viewer.onclick=e=>{if(e.target===viewer)closeViewer()};document.onkeydown=e=>{if(!viewer.classList.contains('show'))return;if(e.key==='ArrowRight')nextPhoto();if(e.key==='ArrowLeft')prevPhoto();if(e.key==='Escape')closeViewer()};places.forEach(place=>{const thumbs=place.photos.map((src,i)=>'<img src="'+src+'" data-i="'+i+'" loading="lazy">').join('');const popup='<div class="place">'+place.name+'</div><div class="gallery">'+thumbs+'</div><div class="hint">Scroll the bar below to see every photo • Click a photo to enlarge</div>';const marker=L.marker([place.lat,place.lon],{icon:icon}).addTo(map).bindPopup(popup,{maxWidth:430});marker.on('popupopen',e=>{e.popup.getElement().querySelector('.gallery').addEventListener('click',ev=>{if(ev.target.tagName==='IMG'){currentPhotos=place.photos;showPhoto(+ev.target.dataset.i)}})})});</script></body></html>
